name: mhed

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    container_name: mhed-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mhed}
      POSTGRES_USER: ${POSTGRES_USER:-mhed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=30
    volumes:
      - mhed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 640m
    pids_limit: 192
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  api:
    container_name: mhed-api
    image: mhed-api:${MHED_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8080"
      GOMEMLIMIT: 448MiB
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-mhed}
      PGUSER: ${POSTGRES_USER:-mhed}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      MHED_GAME_DATA_PATH: /game-data/mh3g.sqlite
      MHED_GAME_MANIFEST_PATH: /game-data/manifest.json
      MHED_ADMIN_ORIGIN: ${MHED_ADMIN_ORIGIN:-http://127.0.0.1:18102}
      MHED_COOKIE_SECURE: ${MHED_COOKIE_SECURE:-false}
      MHED_REPORT_HMAC_KEY: ${MHED_REPORT_HMAC_KEY:-development-only-report-key-change-me}
      MHED_SECRET_ENCRYPTION_KEY: ${MHED_SECRET_ENCRYPTION_KEY:-bWhlZC1kZXZlbG9wbWVudC1lbWFpbC1rZXktdjEhISE}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${MHED_API_PORT:-18100}:8080
    healthcheck:
      test: ["CMD", "/mhed-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    cpus: 1.25
    mem_limit: 640m
    pids_limit: 192
    read_only: true
    volumes:
      - mhed-game-data:/game-data:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge
      - backend

  migrate:
    container_name: mhed-migrate
    image: mhed-api:${MHED_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: api/Dockerfile
    entrypoint: ["/mhedctl", "migrate", "up"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-mhed}
      PGUSER: ${POSTGRES_USER:-mhed}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGSSLMODE: disable
      MHED_ADMIN_ORIGIN: ${MHED_ADMIN_ORIGIN:-http://127.0.0.1:18102}
      MHED_COOKIE_SECURE: ${MHED_COOKIE_SECURE:-false}
      MHED_REPORT_HMAC_KEY: ${MHED_REPORT_HMAC_KEY:-development-only-report-key-change-me}
      MHED_SECRET_ENCRYPTION_KEY: ${MHED_SECRET_ENCRYPTION_KEY:-bWhlZC1kZXZlbG9wbWVudC1lbWFpbC1rZXktdjEhISE}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cpus: 0.30
    mem_limit: 192m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

  front:
    container_name: mhed-front
    image: mhed-front:${MHED_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/front/Dockerfile
    ports:
      - 127.0.0.1:${MHED_WEB_PORT:-18101}:8080
      - 127.0.0.1:${MHED_ADMIN_PORT:-18102}:8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    cpus: 0.20
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m
      - /var/run:size=1m
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

  game-data-import:
    container_name: mhed-game-data-import
    image: mhed-api:${MHED_IMAGE_TAG:-local}
    profiles: [ops]
    entrypoint: ["/mhedctl"]
    command: ["import-game-data", "--source", "/source/mh3g.sqlite", "--manifest", "/source/manifest.json", "--destination", "/game-data"]
    user: "0:0"
    volumes:
      - ./game-data/runtime:/source:ro
      - mhed-game-data:/game-data
    restart: "no"
    cpus: 0.20
    mem_limit: 96m
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backup:
    container_name: mhed-backup
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-mhed}
      PGUSER: ${POSTGRES_USER:-mhed}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          umask 077
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump --format=custom --file="/backups/mhed-$${stamp}.dump.tmp"
          mv "/backups/mhed-$${stamp}.dump.tmp" "/backups/mhed-$${stamp}.dump"
          find /backups -type f -name 'mhed-*.dump' -mtime +7 -delete
          sleep 86400
        done
    volumes:
      - mhed-backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.10
    mem_limit: 96m
    pids_limit: 32
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend

volumes:
  mhed-postgres:
    name: mhed-postgres
  mhed-game-data:
    name: mhed-game-data
  mhed-backups:
    name: mhed-backups

networks:
  edge:
  backend:
    internal: true
